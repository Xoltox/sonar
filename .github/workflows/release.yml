name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: make all VERSION=${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  universal:
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create universal binary
        working-directory: dist
        run: |
          chmod +x sonar-darwin-*
          lipo -create -output sonar-darwin-universal sonar-darwin-amd64 sonar-darwin-arm64
          lipo -info sonar-darwin-universal
          out="$(./sonar-darwin-universal version)"
          echo "$out"
          test "$out" = "sonar ${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: universal
          path: dist/sonar-darwin-universal
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build, universal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: universal
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          sha256sum sonar-* > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 7
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Sonar $GITHUB_REF_NAME" --generate-notes --verify-tag $flags
